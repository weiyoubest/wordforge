[versions]
agp = "8.5.2"
kotlin = "1.9.22"
kapt = "1.9.22"
ksp = "1.9.22-1.0.17"
coreKtx = "1.12.0"
appcompat = "1.6.1"
material3 = "1.11.0"
lifecycle = "2.7.0"
navigation = "2.7.7"
room = "2.6.1"
coroutines = "1.7.3"
viewpager2 = "1.1.0"
activityKtx = "1.8.2"
fragmentKtx = "1.6.2"
swiperefreshlayout = "1.1.0"
datastore = "1.0.0"
mpchart = "3.1.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material3 = { group = "com.google.android.material", name = "material", version.ref = "material3" }
